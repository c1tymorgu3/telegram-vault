name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test ve lint araclari requirements.txt'te degil (calisma zamani
          # bagimliligi degiller). pytest-asyncio olmadan async testler
          # sessizce atlanir, bu yuzden acikca kuruluyor.
          pip install "ruff>=0.17,<0.18" bandit pip-audit pytest pytest-asyncio

      - name: Lint (ruff) - hata varsa job fail
        run: python -m ruff check .

      - name: Guvenlik taramasi (bandit)
        # Sadece bilgilendirici: mevcut kod tabanindaki bulgular job'i bloke etmesin.
        continue-on-error: true
        run: bandit -r . -x ./.venv,./tests -ll

      - name: Bagimlilik denetimi (pip-audit --strict)
        run: pip-audit --strict -r requirements.txt

      - name: Testler (pytest) - hata varsa job fail
        run: python -m pytest tests -q
